name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} · JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      # The real-APK corpus is large; download once per lock-file change.
      - name: Cache APK corpus
        uses: actions/cache@v4
        with:
          path: fixtures/external
          key: apk-corpus-${{ hashFiles('fixtures/external.lock') }}

      - name: Fetch APK corpus
        shell: bash
        run: scripts/fetch-apks.sh

      - name: Build and test
        run: ./gradlew build
