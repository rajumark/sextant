name: Release

# Publishes a release only when a push to main has the commit message exactly "#go".
# The version comes from gradle.properties; the tag v<version> is created by this workflow.
on:
  push:
    branches: [main]

jobs:
  cli:
    if: github.event.head_commit.message == '#go'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.version.outputs.version }} is already released; bump version in gradle.properties"
            exit 1
          fi
      - name: Cache APK corpus
        uses: actions/cache@v4
        with:
          path: fixtures/external
          key: apk-corpus-${{ hashFiles('fixtures/external.lock') }}
      - name: Fetch APK corpus
        run: scripts/fetch-apks.sh
      - name: Test and build the CLI zip
        run: ./gradlew :core:build :cli:build :cli:shadowDistZip
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: cli/build/distributions/sextant-*.zip

  desktop:
    needs: cli
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            format: dmg
            platform: macos-arm64
          - os: windows-latest
            format: msi
            platform: windows-x64
          - os: ubuntu-latest
            format: deb
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installer
        run: ./gradlew :desktop:packageDistributionForCurrentOS
      - name: Name it by platform
        shell: bash
        run: |
          mkdir -p dist
          src=$(ls desktop/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }})
          cp "$src" "dist/Sextant-${{ needs.cli.outputs.version }}-${{ matrix.platform }}.${{ matrix.format }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*

  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${{ needs.cli.outputs.version }}" \
            'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.cli.outputs.version }}" dist/* \
            --target "${{ github.sha }}" \
            --title "Sextant ${{ needs.cli.outputs.version }}" \
            --notes-file notes.md
