site_name: Sextant CLI
site_description: Turn an Android APK into structured data for people, scripts and AI agents.
site_url: https://rajumark.github.io/sextant/cli/
repo_url: https://github.com/rajumark/sextant
repo_name: rajumark/sextant
edit_uri: edit/main/cli-docs/content/
docs_dir: content
site_dir: ../docs/cli
copyright: Apache-2.0 · Sextant

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [".", ".."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Investigating an app: guides/investigating.md
      - Security review: guides/security-review.md
      - Comparing versions: guides/diff.md
      - Insights and app icons: guides/insights.md
      - Components, startup, resources and SDKs: guides/app-structure.md
      - AI agents and MCP: guides/ai-agents.md
      - Scripting with JSON and SQL: guides/scripting.md
      - Code search, obfuscated apps and bundles: guides/obfuscated-code.md
  - Reference:
      - Commands: reference/commands.md
      - Output files: reference/output.md
      - SQLite index schema: reference/index-schema.md
      - Review findings: reference/findings.md
      - Exit codes and errors: reference/exit-codes.md
  - About:
      - How Sextant is tested: about/testing.md
      - Limitations: about/limitations.md
      - Changelog: about/changelog.md
