# Release config. Run locally with `jreleaser full-release` once the GitHub repo exists.
# Publishing is on hold until the repository is created (see docs/index.html).
project:
  name: sextant
  description: Turn an Android APK into structured data for people and AI agents
  longDescription: |
    Sextant is a command-line tool that turns an APK into deterministic JSON/JSONL files
    (manifest, permissions, components, code structure) and a SQLite index you can query.
  authors:
    - rajumark
  license: Apache-2.0
  links:
    homepage: https://github.com/rajumark/sextant
  java:
    version: 17
  inceptionYear: 2026

release:
  github:
    owner: rajumark
    name: sextant
    overwrite: false
    changelog:
      external: CHANGELOG.md

checksum:
  individual: true

distributions:
  sextant:
    type: JAVA_BINARY
    artifacts:
      - path: cli/build/distributions/sextant-{{projectVersion}}.zip

packagers:
  brew:
    active: RELEASE
    repository:
      owner: rajumark
      name: homebrew-tap
